<section class="section-premium">
  <div class="container">
    <h2 class="visually-hidden">Преміальне</h2>

    <div class="img-model-price">
      <picture>
        <source
          media="(min-width:1158px)"
          srcset="/castle-on-saltovka/assets/Rectangle@1x-c7fb6191.png 1x, /castle-on-saltovka/assets/Rectangle@2x-89420787.png 2x"
          width="360"
        />
        <source
          media="(min-width:768px)"
          srcset="/castle-on-saltovka/assets/Rectangle@1x-c7fb6191.png 1x, /castle-on-saltovka/assets/Rectangle@2x-89420787.png 2x"
          width="360"
        />
        <source
          media="(max-width:768px)"
          srcset="/castle-on-saltovka/assets/GoldenSoftGS-200Z-5@1x-5b793694.png 1x, /castle-on-saltovka/assets/GoldenSoftGS-200Z-5@2x-554ae4c9.png 2x"
        />
        <img
          src="/castle-on-saltovka/assets/GoldenSoftGS-200Z-5@1x-5b793694.png"
          alt="door lock"
          width="264"
          class="foto gallery"
        />
      </picture>

      <div class="model-price">
        <h3 class="model"><span>Golden Soft</span> GS-200Z-5 для офісу</h3>

        <p class="model-text">
          Замок дверний електронний Golden Soft GS-200Z-5 має розкішний
          глянсовий блиск, чіткі лінії, красиві форми.
        </p>
        <p class="model-text model-text-bottom">
          Підходить для встановлення на дерев'яні/міжкімнатні двері.
        </p>
        <p class="price">
          <span class="price-text">Ціна</span>
          <span class="price-sum">5000 грн.</span>
        </p>

        <button type="button" class="button-addition">Додати до кошика</button>
      </div>
    </div>

    <div class="container-anime">
      <button type="button" class="button">
        <svg Class="icon-chevron-left" width="20" height="20">
          <use href="./img/icons.svg#icon-chevron-left"></use>
        </svg>
      </button>

      <ul class="anime-ball-hoop">
        <li class="anime-ball">
          <svg Class="ball-icon" width="4" height="4">
            <use href="./img/icons.svg#icon-circle"></use>
          </svg>
        </li>
        <li class="anime-hoop">
          <svg Class="hoop-icon" width="20" height="20">
            <use href="./img/icons.svg#icon-circle-thin"></use>
          </svg>
        </li>
        <li class="anime-ball">
          <svg Class="ball-icon" width="4" height="4">
            <use href="./img/icons.svg#icon-circle"></use>
          </svg>
        </li>
      </ul>
      <button type="button" class="button">
        <svg Class="icon-chevron-tright" width="20" height="20">
          <use href="./img/icons.svg#icon-chevron-tright"></use>
        </svg>
      </button>
    </div>
  </div>
</section>
