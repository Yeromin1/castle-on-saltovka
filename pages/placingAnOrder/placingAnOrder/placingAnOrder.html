<section class="placing-order">
  <div class="container">
    <h2 class="title-placing-order">Оформлення замовлення</h2>

    <form class="form-placing-order" name="issue_report_form" autocomplete="on">
      <p class="text-placing-order">1. Контактні дані</p>
      <div class="container-label">
        <label class="label-placing-order">
          <span class="span-placing-order">Ім'я</span>
          <input
            class="input-placing-order"
            type="text"
            name="user-name"
            placeholder="Ваше ім'я"
            required
          />
        </label>

        <label class="label-placing-order">
          <span class="span-placing-order">Прізвище</span>
          <input
            class="input-placing-order"
            type="text"
            name="user-nickname"
            placeholder="Ваше прізвище"
            required
          />
        </label>

        <label class="label-placing-order">
          <span class="span-placing-order">Телефон</span>
          <input
            class="input-placing-order"
            type="tel"
            name="user-phone"
            placeholder="Ваш номер телефону"
            required
          />
        </label>

        <label class="label-placing-order">
          <span class="span-placing-order">E-mail</span>
          <input
            class="input-placing-order"
            type="email"
            name="user-email"
            placeholder="Ваш E-mail"
          />
        </label>
      </div>
    </form>

    <form>
      <p class="text-placing-order">2. Доставка</p>
      <div class="container-delivery">
        <label class="label-delivery">
          <input
            type="radio"
            name="delivery"
            value="Кур'єр на вашу адресу"
            class="radio-delivery"
          />
          <span class="span-delivery">Кур'єр на вашу адресу</span>
        </label>

        <label class="label-delivery">
          <input type="radio" name="delivery" value="Самовивіз з Нової Пошти" />
          <span class="span-delivery">Самовивіз з Нової Пошти</span>
        </label>

        <label class="label-delivery">
          <input
            type="radio"
            name="delivery"
            value="Самовивіз з поштоматів Нової Пошти"
          />
          <span class="span-delivery">Самовивіз з поштоматів Нової Пошти</span>
        </label>

        <label class="label-delivery">
          <input type="radio" name="delivery" value="Самовивіз з Meest ПОШТА" />
          <span class="span-delivery">Самовивіз з Meest ПОШТА</span>
        </label>

        <label class="label-delivery">
          <input type="radio" name="delivery" value="Самовивіз з УКРПОШТИ" />
          <span class="span-delivery">Самовивіз з УКРПОШТИ</span>
        </label>
      </div>

      <p class="text-placing-order">3. Оплата</p>
      <label>
        <input
          type="radio"
          name="payment"
          value="Оплата під час отримання товару"
        />
        <span class="">Оплата під час отримання товару</span>
      </label>

      <label>
        <input type="radio" name="payment" value="Оплатити зараз" />
        Оплатити зараз
      </label>

      <label for="user-comment">Коментар</label>
      <textarea
        name="user-comment"
        rows="5"
        class="form-textarea"
        placeholder="Напишіть коментар"
        id="user-comment"
      ></textarea>
    </form>
  </div>
</section>
